name: Auto Extract ZIP
on:
  push:
    paths:
      - '**.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and clean zip
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            unzip -o "$z"
            rm -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ZIP dosyasi otomatik cikartildi" || exit 0
          git push
