<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Krallık Yolu</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#top{position:absolute;top:0;left:0;right:0;padding:4px 8px;background:rgba(0,0,0,.68);font-size:13px;line-height:1.55;pointer-events:none}
#top span{margin-right:10px;white-space:nowrap}
#mm{position:absolute;right:6px;top:52px;border:2px solid #000b;width:96px;height:96px;background:#000;image-rendering:pixelated}
#log{position:absolute;left:6px;top:52px;max-width:58%;font-size:12px;pointer-events:none}
#log div{pointer-events:auto;background:rgba(0,0,0,.65);padding:3px 8px;margin-bottom:3px;border-radius:6px;animation:f 10s forwards}
@keyframes f{0%,85%{opacity:1}100%{opacity:0}}
#hint{position:absolute;left:0;right:0;bottom:56px;text-align:center;display:none}
#hint span{background:rgba(0,0,0,.75);padding:6px 10px;border-radius:8px;font-size:13px;margin-right:6px}
#selinfo{position:absolute;left:6px;bottom:56px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;display:none;pointer-events:none}
#bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.8);overflow-x:auto}
button{background:#3b4a2f;color:#fff;border:1px solid #7a9a5a;border-radius:8px;padding:8px 10px;font-size:13px;white-space:nowrap;font-family:inherit}
button:active{background:#55703f}
button.dis{opacity:.4}
#panel{position:absolute;bottom:52px;left:0;right:0;max-height:52%;overflow:auto;background:rgba(15,20,12,.94);padding:6px 8px;display:none;border-top:2px solid #7a9a5a}
#panel .row{display:flex;gap:8px;align-items:center;margin:4px 0}
#panel .row small{opacity:.85;font-size:12px;line-height:1.3}
#panel h4{margin:6px 0 2px;font-size:14px}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:#7ac14a}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#1d2616;border:2px solid #7a9a5a;border-radius:12px;padding:14px;max-width:420px;width:100%}
#modal h3{margin:0 0 8px}
#modal p{margin:0 0 12px;font-size:14px;line-height:1.45}
#mbtn{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"></div>
<canvas id="mm" width="96" height="96"></canvas>
<div id="log"></div>
<div id="hint"><span id="hinttxt"></span><span id="hintbtn"></span></div>
<div id="selinfo"></div>
<div id="panel"></div>
<div id="bar"></div>
<div id="modal"><div class="box"><h3 id="mt"></h3><p id="mb"></p><div id="mbtn"></div></div></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/units.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
</body>
</html>
